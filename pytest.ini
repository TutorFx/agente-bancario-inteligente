[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
testpaths =
    tests
python_files = test_*.py
markers =
    eval: avaliação de comportamento dos agentes com LLM real (lenta e com custo de API); rode com `pytest -m eval`
    e2e: teste ponta a ponta que chama a LLM real; pulado sem GEMINI_API_KEY/GOOGLE_API_KEY/LLM_API_KEY
addopts = 
    -m "not eval"
    --cov=root_agent
    --cov-report=term-missing
    --cov-fail-under=75
