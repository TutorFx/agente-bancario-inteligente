[project]
name = "agente-banco-agil"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "python-dotenv==1.2.2",
    "google-adk==1.33.0",
    "requests==2.34.1",
    "httpx==0.28.1",
    "litellm>=1.93.0",
    "pydantic==2.13.4",
    "google-genai==1.75.0",
    "fastapi==0.136.1",
    "uvicorn==0.46.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-mock>=3.12.0",
    "pytest-cov>=4.1.0",
    "filelock>=3.29.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "deepeval>=4.0.6",
    "pyyaml>=6.0",
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
]

[project.scripts]
test = "pytest:console_main"

[tool.setuptools.packages.find]
where = ["."]
include = ["root_agent*"]
